<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket.exe · Find events and book tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/events" aria-label="Ticket.exe, discover events">
        <span class="logo-mark" aria-hidden="true">T</span><span class="logo-word">Ticket.exe</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/events" data-nav="events">Discover</a>
        <a href="#/bookings" data-nav="bookings">My tickets</a>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>Ticket.exe customer app</span>
    <span>Payments are simulated. No real money is charged.</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
