<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket.exe · Organiser console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- type="module" lets each JS file import the others -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <!-- Side navigation: hidden until the user logs in -->
    <aside class="sidebar" id="sidebar" hidden>
      <a class="brand" href="#/events" aria-label="Ticket.exe home">
        <svg class="brand-mark" viewBox="0 0 32 22" aria-hidden="true">
          <path d="M3 1h26a2 2 0 0 1 2 2v5a3 3 0 0 0 0 6v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-5a3 3 0 0 0 0-6V3a2 2 0 0 1 2-2z"/>
          <path class="brand-perf" d="M21 4v14" />
        </svg>
        <span class="brand-text">Ticket.exe</span>
      </a>
      <p class="brand-sub">Organiser console</p>

      <nav class="nav" aria-label="Main">
        <a href="#/events" data-nav="events">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Events
        </a>
        <a href="#/venues" data-nav="venues">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          Venues
        </a>
      </nav>

      <div class="user-card">
        <span class="avatar" id="user-avatar" aria-hidden="true"></span>
        <span class="user-info">
          <span class="user-name" id="user-name"></span>
          <span class="user-role" id="user-role"></span>
        </span>
        <button class="icon-btn" id="logout-btn" type="button" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
        </button>
      </div>
    </aside>

    <!-- Every page is drawn inside here by js/app.js -->
    <main id="app" class="main"></main>
  </div>

  <!-- Pop-up success / error messages -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
